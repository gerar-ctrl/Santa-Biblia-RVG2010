<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="55%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)"/>
  <!-- Marco dorado interior -->
  <rect x="48" y="48" width="416" height="416" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <!-- Silueta de Libro / Biblia -->
  <g filter="url(#shadow)">
    <rect x="116" y="84" width="280" height="344" rx="24" fill="#5c1111" stroke="url(#goldGrad)" stroke-width="8"/>
    <!-- Lomo del libro -->
    <path d="M148 84 v344" stroke="url(#goldGrad)" stroke-width="5" opacity="0.8"/>
    <!-- Páginas inferiores -->
    <path d="M124 412 h264 a12 12 0 0 1 0 16 h-264 a8 8 0 0 1 0 -16 z" fill="#faf8f5"/>
    <!-- Cinta separadora -->
    <path d="M240 424 v48 l16 -14 l16 14 v-48 z" fill="#eab308"/>
    <!-- Cruz Dorada Central -->
    <rect x="250" y="136" width="24" height="148" rx="5" fill="url(#goldGrad)"/>
    <rect x="206" y="174" width="112" height="24" rx="5" fill="url(#goldGrad)"/>
  </g>
  <!-- Texto RVG -->
  <text x="262" y="348" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">RVG</text>
  <text x="262" y="382" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="6" opacity="0.9">2010</text>
</svg>